name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Verify release identity and main ancestry
        run: |
          node scripts/check-release.mjs
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main --unshallow
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Pack the checked library
        id: pack
        run: |
          mkdir release
          bun pm pack --destination release
          node --input-type=module -e 'import {appendFileSync,readdirSync} from "node:fs";const files=readdirSync("release").filter(f=>f.endsWith(".tgz"));if(files.length!==1)throw new Error("Expected one archive");appendFileSync(process.env.GITHUB_OUTPUT,`archive=release/${files[0]}\n`);'
          cd release
          sha256sum ./*.tgz > SHA256SUMS
      - name: Render reviewed release notes
        run: node scripts/release-notes.mjs --write release/notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-update-release
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-update-release
          path: release
      - name: Verify the artifact handoff
        run: |
          node scripts/check-release.mjs
          node scripts/release-notes.mjs --verify release/notes.md
          cd release
          sha256sum --check SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release/*.tgz
      - name: Publish or verify the complete immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
